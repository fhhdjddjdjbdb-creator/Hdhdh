<!-- 
Tác giả: palofsc
Mục đích: Phiên bản tối giản, chế độ tối hoàn toàn (True Dark Mode), loại bỏ các nút không cần thiết.
Chi tiết: Giao diện Arabic RTL, tập trung duy nhất vào chức năng tìm kiếm trực tiếp.
-->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بحث جوجل الخفي</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            /* لون داكن عميق للموقع بالكامل */
            background-color: #121212; 
            color: #ffffff;
            overflow: hidden;
        }

        /* اسم المطور */
        .developer-name {
            font-size: 14px;
            color: #888;
            margin-bottom: 10px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .logo {
            font-size: 60px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
        }
        .logo span:nth-child(1) { color: #4285F4; }
        .logo span:nth-child(2) { color: #EA4335; }
        .logo span:nth-child(3) { color: #FBBC05; }
        .logo span:nth-child(4) { color: #4285F4; }
        .logo span:nth-child(5) { color: #34A853; }
        .logo span:nth-child(6) { color: #EA4335; }

        .container {
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .search-wrapper {
            width: 100%;
            position: relative;
        }

        /* صندوق البحث داكن متناسق */
        .search-box {
            width: 100%;
            padding: 14px 20px;
            font-size: 16px;
            border: 1px solid #333;
            border-radius: 24px;
            outline: none;
            background-color: #1e1e1e;
            color: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.8);
            transition: box-shadow 0.3s;
            text-align: right;
            -webkit-appearance: none;
        }

        .search-box:focus {
            box-shadow: 0 0 8px #4285F4;
            border-color: #4285F4;
        }

        .btn-group {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            width: 100%;
        }

        /* زر بحث جوجل فقط */
        .btn {
            background-color: #303134;
            border: 1px solid #5f6368;
            border-radius: 24px;
            color: #e8eaed;
            font-size: 15px;
            padding: 12px 30px;
            cursor: pointer;
            text-align: center;
            transition: background 0.2s;
            font-weight: bold;
        }

        .btn:active {
            background-color: #444;
        }

        .incognito-info {
            margin-top: 20px;
            font-size: 12px;
            color: #666;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="developer-name">Developer: Mohamed Tamer</div>

    <div class="logo">
        <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
    </div>

    <div class="container">
        <!-- البحث يبدأ فوراً دون طلب تسجيل دخول وبدون أزرار إضافية -->
        <form id="directGoogleForm" action="https://www.google.com/search" method="GET" style="width: 100%;">
            <div class="search-wrapper">
                <input type="text" name="q" class="search-box" placeholder="ابحث الآن في جوجل..." required autocomplete="off">
            </div>
            <div class="btn-group">
                <button type="submit" class="btn">بحث جوجل</button>
            </div>
        </form>
        <div class="incognito-info">تصفح خفي ومباشر</div>
    </div>

    <script>
        /* 
           طُور بواسطة palofsc:
           1. تحويل الموقع بالكامل للون الأسود الداكن (Darkest Theme).
           2. إزالة زر "ضربة حظ".
           3. جعل عملية البحث مباشرة وسريعة بدون قيود أو تسجيل دخول.
        */
    </script>

</body>
</html>
