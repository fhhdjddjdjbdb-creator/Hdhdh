<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة أدمن تطبيق المحادثات والتحديثات</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #030712; color: #f3f4f6; user-select: none; }
        .cyber-glass { 
            background: linear-gradient(145deg, rgba(17, 24, 39, 0.75), rgba(15, 23, 42, 0.85)); 
            backdrop-filter: blur(24px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            box-shadow: 0 20px 50px -10px rgba(0,0,0,0.8); 
        }
        .neon-btn {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.35);
        }
        @keyframes popIn { 
            from { opacity: 0; transform: scale(0.96) translateY(8px); } 
            to { opacity: 1; transform: scale(1) translateY(0); } 
        }
        .animate-enter { animation: popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="bg-[#030712] text-slate-100 min-h-screen p-4 md:p-8">

    <div class="max-w-3xl mx-auto space-y-6">
        
        <!-- هيدر اللوحة -->
        <header class="cyber-glass p-6 rounded-[2rem] flex flex-wrap items-center justify-between gap-4 border border-slate-800 animate-enter">
            <div class="flex items-center gap-3.5">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 text-white flex items-center justify-center text-xl shadow-lg neon-btn">
                    <i class="fa-solid fa-user-shield"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black text-white tracking-wide">إدارة مستخدمي الشات والتحديثات</h1>
                    <p class="text-xs text-slate-400 mt-0.5">مراقبة الحسابات، كلمات المرور، ورفع ملفات التحديثات الفورية</p>
                </div>
            </div>
            <div class="px-4 py-2 rounded-xl bg-slate-900 border border-slate-800 text-xs font-bold text-blue-400 flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-blue-500 animate-ping"></span> متصل مباشرة بالفايربيس
            </div>
        </header>

        <!-- قسم رفع ملفات التحديثات الجديدة الفورية -->
        <div class="cyber-glass p-6 rounded-[2.5rem] space-y-4 border border-slate-800 animate-enter">
            <h2 class="text-sm font-black text-white flex items-center gap-2 border-b border-slate-800 pb-3">
                <i class="fa-solid fa-cloud-arrow-up text-blue-400"></i> رفع ملفات التحديث الجديد لتطبيق المستخدمين
            </h2>
            <p class="text-[11px] text-slate-400">اختر ملف التحديث أو الشكل الجديد من جهازك، وسيتم تطبيقه وتحديثه لدى جميع المستخدمين فوراً:</p>
            
            <form onsubmit="publishFileUploadUpdate(event)" class="space-y-3.5">
                <input type="text" id="update-file-title" required placeholder="عنوان أو اسم التحديث (مثال: تحديث واجهة الشات الجديدة)..." class="w-full px-4.5 py-3 rounded-2xl bg-slate-900 border border-slate-800 text-white text-xs outline-none focus:border-blue-500">
                
                <!-- زر رفع الملفات الفعلي من الجهاز -->
                <label class="flex flex-col items-center justify-center gap-2 w-full py-5 px-4 bg-slate-900 border border-dashed border-slate-700 rounded-2xl cursor-pointer hover:border-blue-500 transition-all">
                    <i class="fa-solid fa-file-arrow-up text-blue-400 text-2xl"></i>
                    <span id="selected-update-filename" class="text-xs font-bold text-slate-300">اضغط لاختيار ملف التحديث من جهازك...</span>
                    <input type="file" id="app-update-file" required onchange="handleUpdateFileSelect(event)" class="hidden">
                </label>

                <button type="submit" id="upload-update-btn" class="w-full py-3.5 neon-btn text-white font-black rounded-2xl text-xs cursor-pointer shadow-lg">رفع وتطبيق التحديث لجميع المستخدمين</button>
            </form>
        </div>

        <!-- قائمة المستخدمين والتوثيق -->
        <div class="cyber-glass p-6 rounded-[2.5rem] space-y-4 border border-slate-800 animate-enter">
            <div class="flex items-center justify-between px-2">
                <h2 class="text-sm font-black text-white flex items-center gap-2">
                    <i class="fa-solid fa-users text-blue-400"></i> الحسابات المسجلة (<span id="users-count">0</span>)
                </h2>
            </div>

            <div id="admin-users-list" class="space-y-3">
                <div class="text-center py-20 text-slate-500 text-xs font-bold">جاري تحميل الحسابات...</div>
            </div>
        </div>

    </div>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA2k-wSnJ3UjSNSv1amcodfjSNJthu_P6Y",
            databaseURL: "https://mohmed-e9bc6-default-rtdb.firebaseio.com",
            projectId: "mohmed-e9bc6",
            storageBucket: "mohmed-e9bc6.firebasestorage.app"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let selectedFileBase64 = null;

        function handleUpdateFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('selected-update-filename').textContent = `تم اختيار الملف: ${file.name}`;
            
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function() {
                selectedFileBase64 = reader.result;
            };
        }

        function publishFileUploadUpdate(e) {
            e.preventDefault();
            const title = document.getElementById('update-file-title').value.trim();

            if (!selectedFileBase64) {
                alert('يرجى اختيار ملف التحديث أولاً!');
                return;
            }

            const btn = document.getElementById('upload-update-btn');
            btn.textContent = 'جاري الرفع والتحديث...';
            btn.disabled = true;

            const updateObj = {
                title: title,
                fileData: selectedFileBase64,
                time: Date.now()
            };

            db.ref('app_file_updates').set(updateObj).then(() => {
                alert('تم رفع ملف التحديث بنجاح وسيظهر تلقائياً عند جميع المستخدمين!');
                document.getElementById('update-file-title').value = '';
                document.getElementById('app-update-file').value = '';
                document.getElementById('selected-update-filename').textContent = 'اضغط لاختيار ملف التحديث من جهازك...';
                selectedFileBase64 = null;
                btn.textContent = 'رفع وتطبيق التحديث لجميع المستخدمين';
                btn.disabled = false;
            }).catch(err => {
                alert('حدث خطأ أثناء الرفع، تأكد من حجم الملف.');
                btn.textContent = 'رفع وتطبيق التحديث لجميع المستخدمين';
                btn.disabled = false;
            });
        }

        db.ref('chat_users').on('value', snap => {
            const users = snap.val() || {};
            const listContainer = document.getElementById('admin-users-list');
            const countEl = document.getElementById('users-count');
            const keys = Object.keys(users);

            countEl.textContent = keys.length;

            if (keys.length === 0) {
                listContainer.innerHTML = `<div class="text-center py-16 text-slate-500 text-xs font-bold">لا يوجد شيء</div>`;
                return;
            }

            let html = '';
            keys.forEach(username => {
                const u = users[username];
                const isVerified = u.verified === true;
                const cleanName = username.replace('@', '');
                const firstChar = cleanName.charAt(0).toUpperCase();

                const avatarHtml = u.avatar 
                    ? `<img src="${u.avatar}" class="w-full h-full object-cover">` 
                    : `<span class="font-black text-sm">${firstChar}</span>`;

                const verifyBadge = isVerified 
                    ? `<span class="inline-flex items-center justify-center text-sky-500 text-sm ml-1" title="حساب موثق"><i class="fa-solid fa-circle-check"></i></span>` 
                    : '';

                html += `
                <div class="cyber-glass p-4 rounded-3xl flex flex-wrap items-center justify-between gap-3.5 border border-slate-800/80 transition-all hover:border-blue-500/30">
                    <div class="flex items-center gap-3.5">
                        <div class="w-13 h-13 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 text-white font-bold flex items-center justify-center text-sm shadow-md overflow-hidden shrink-0 border border-blue-400/30">
                            ${avatarHtml}
                        </div>
                        <div>
                            <div class="flex items-center gap-1">
                                <h3 class="text-xs font-black text-white">${username}</h3>
                                ${verifyBadge}
                            </div>
                            <div class="text-[11px] text-slate-400 mt-1 font-semibold">
                                كلمة المرور: <span class="text-blue-300 font-mono bg-slate-900/90 px-2 py-0.5 rounded-lg border border-slate-800">${u.password || 'غير محددة'}</span>
                            </div>
                        </div>
                    </div>

                    <div class="flex items-center gap-2">
                        <button onclick="toggleVerification('${username}', ${!isVerified})" class="px-4 py-2.5 rounded-2xl font-bold text-xs transition-all cursor-pointer flex items-center gap-1.5 ${isVerified ? 'bg-sky-950/60 border border-sky-800 text-sky-400 hover:bg-sky-900/60' : 'bg-slate-900 border border-slate-800 text-slate-300 hover:bg-blue-600 hover:text-white'}">
                            <i class="fa-solid fa-circle-check text-xs"></i>
                            ${isVerified ? 'إلغاء التوثيق' : 'توثيق الحساب'}
                        </button>
                    </div>
                </div>`;
            });

            listContainer.innerHTML = html;
        });

        window.toggleVerification = async function(username, status) {
            await db.ref('chat_users/' + username).update({ verified: status });
        }
    </script>
</body>
</html>
