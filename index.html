<!-- 
Tác giả: palofsc
Mục đích: Phiên bản tối ưu cuối cùng với tên hình ảnh xác định 'main_logo.png'.
Chi tiết: True Dark Mode, Tự động tải ảnh, Tối ưu cho di động, Tiếng Ả Rập.
-->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بحث جوجل الخفي</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #121212; 
            color: #ffffff;
            overflow-x: hidden;
            overflow-y: auto;
        }

        .developer-name {
            font-size: 14px;
            color: #888;
            margin-bottom: 10px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }

        /* الحاوية المخصصة للصورة */
        .image-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .custom-img {
            max-width: 120px; 
            max-height: 120px;
            border-radius: 50%; /* يجعل الصورة دائرية بشكل احترافي */
            display: none; 
            box-shadow: 0 0 20px rgba(66, 133, 244, 0.3);
            object-fit: cover;
            border: 2px solid #333;
        }

        .logo {
            font-size: 60px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
        }
        .logo span:nth-child(1) { color: #4285F4; }
        .logo span:nth-child(2) { color: #EA4335; }
        .logo span:nth-child(3) { color: #FBBC05; }
        .logo span:nth-child(4) { color: #4285F4; }
        .logo span:nth-child(5) { color: #34A853; }
        .logo span:nth-child(6) { color: #EA4335; }

        .container {
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .search-wrapper {
            width: 100%;
            position: relative;
        }

        .search-box {
            width: 100%;
            padding: 14px 20px;
            font-size: 16px;
            border: 1px solid #333;
            border-radius: 24px;
            outline: none;
            background-color: #1e1e1e;
            color: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.8);
            transition: box-shadow 0.3s;
            text-align: right;
            -webkit-appearance: none;
        }

        .search-box:focus {
            box-shadow: 0 0 8px #4285F4;
            border-color: #4285F4;
        }

        .btn-group {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .btn {
            background-color: #303134;
            border: 1px solid #5f6368;
            border-radius: 24px;
            color: #e8eaed;
            font-size: 15px;
            padding: 12px 30px;
            cursor: pointer;
            text-align: center;
            transition: background 0.2s;
            font-weight: bold;
        }

        .btn:active {
            background-color: #444;
        }

        .incognito-info {
            margin-top: 20px;
            font-size: 12px;
            color: #666;
            text-align: center;
        }

        /* المربع الجديد للصورة أسفل زر البحث */
        .bottom-image-box {
            width: 320px;
            height: 200px;
            margin-top: 28px;
            border: 1px solid #333;
            border-radius: 18px;
            background: #1e1e1e;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 4px 14px rgba(0,0,0,0.55);
        }

        .bottom-image-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            background: #1e1e1e;
        }

        @media (max-width: 420px) {
            .bottom-image-box {
                width: 92vw;
                height: 190px;
            }
        }
    </style>
</head>
<body>

    <div class="developer-name">Developer: Mohamed Tamer</div>

    <div class="image-container">
        <!-- استدعاء الصورة باسم main_logo.png -->
        <img src="main_logo.png" id="userPhoto" class="custom-img" alt="Main Logo">
    </div>

    <div class="logo">
        <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
    </div>

    <div class="container">
        <form id="directGoogleForm" action="https://www.google.com/search" method="GET" style="width: 100%;">
            <div class="search-wrapper">
                <input type="text" name="q" class="search-box" placeholder="ابحث الآن في جوجل..." required autocomplete="off">
            </div>
            <div class="btn-group">
                <button type="submit" class="btn">بحث جوجل</button>
            </div>
        </form>
        <div class="incognito-info">تصفح خفي ومباشر</div>


        <!-- الصورة التي تضعها في نفس مجلد index.html -->
        <!-- اسم الصورة المطلوب: bottom_image.png -->
        <div class="bottom-image-box">
            <img src="bottom_image.png" alt="الصورة الإضافية">
        </div>
    </div>

    <script>
        window.onload = function() {
            const imageElement = document.getElementById('userPhoto');
            // التحقق من أن الصورة تم تحميلها بنجاح لتغيير حالتها من hidden إلى block
            imageElement.onerror = function() {
                this.style.display = 'none'; // إخفاء لو لم تكن الصورة موجودة
            };
            imageElement.onload = function() {
                this.style.display = 'block'; // إظهار الصورة بمجرد تحميلها
            };
        };
    </script>

</body>
</html>
