<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>توقف الموقع مؤقتًا</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    min-height:100%;
    overflow:hidden !important;
    position:fixed;
    inset:0;
    overscroll-behavior:none;
    touch-action:pan-y;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    color:#fff;
    background:
        radial-gradient(circle at 50% 42%, #4a090f 0%, #23080b 25%, #100204 70%);
    display:flex;
    justify-content:center;
    align-items:center;
}

/* توهج الخلفية */
.glow{
    position:absolute;
    width:420px;
    height:420px;
    border-radius:50%;
    background:#e0001b;
    filter:blur(150px);
    opacity:.13;
    pointer-events:none;
}

/* نقاط الخلفية */
.particles{
    position:absolute;
    inset:0;
    overflow:hidden;
    pointer-events:none;
}

.particles span{
    position:absolute;
    width:4px;
    height:4px;
    border-radius:50%;
    background:#ff3348;
    box-shadow:0 0 15px #ff3348;
    opacity:.5;
    animation:float 7s linear infinite;
}

.particles span:nth-child(1){left:8%;top:85%;animation-delay:0s}
.particles span:nth-child(2){left:18%;top:25%;animation-delay:1s}
.particles span:nth-child(3){left:31%;top:72%;animation-delay:2s}
.particles span:nth-child(4){left:49%;top:12%;animation-delay:3s}
.particles span:nth-child(5){left:68%;top:78%;animation-delay:1.5s}
.particles span:nth-child(6){left:82%;top:22%;animation-delay:2.5s}
.particles span:nth-child(7){left:94%;top:63%;animation-delay:4s}

@keyframes float{
    0%{
        transform:translateY(90px) scale(.4);
        opacity:0;
    }
    30%{opacity:.7}
    70%{opacity:.7}
    100%{
        transform:translateY(-180px) scale(1.3);
        opacity:0;
    }
}

/* المحتوى */
.page{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    position:relative;
    z-index:2;
}

/* كلمة قريباً نعود */
.coming{
    position:absolute;
    top:25px;
    left:50%;
    transform:translateX(-50%);
    white-space:nowrap;

    padding:10px 23px;
    border-radius:30px;

    color:#ff3348;
    border:1px solid #5a1018;
    background:rgba(35,8,11,.7);
    box-shadow:0 0 25px rgba(224,0,27,.12);

    font-size:14px;
    font-weight:bold;
    letter-spacing:2px;

    animation:comingPulse 2.5s ease-in-out infinite;
}

@keyframes comingPulse{
    0%,100%{
        opacity:.45;
        box-shadow:0 0 10px rgba(224,0,27,.08);
    }
    50%{
        opacity:1;
        box-shadow:0 0 28px rgba(224,0,27,.3);
    }
}

/* البطاقة */
.card{
    width:min(92vw,520px);
    padding:34px 25px 27px;
    text-align:center;

    background:rgba(24,5,7,.86);
    border:1px solid #5a1018;
    border-radius:28px;

    box-shadow:
        0 30px 80px rgba(0,0,0,.55),
        0 0 45px rgba(224,0,27,.1);

    backdrop-filter:blur(18px);
}

/* الرسمة */
.illustration{
    width:190px;
    height:145px;
    margin:0 auto 22px;
    position:relative;
}

/* شاشة */
.monitor{
    position:absolute;
    width:125px;
    height:88px;
    left:32px;
    top:15px;

    border-radius:12px;
    background:linear-gradient(145deg,#3d080d,#180507);
    border:3px solid #8b000f;

    box-shadow:
        0 0 25px rgba(224,0,27,.25),
        inset 0 0 20px rgba(224,0,27,.12);
}

.monitor::before{
    content:"";
    position:absolute;
    width:55px;
    height:4px;
    background:#e0001b;
    border-radius:10px;
    left:32px;
    top:39px;
    box-shadow:0 0 15px #e0001b;
}

/* قاعدة الشاشة */
.stand{
    position:absolute;
    width:45px;
    height:13px;
    left:72px;
    top:103px;
    background:#5a1018;
    border-radius:4px;
}

.base{
    position:absolute;
    width:80px;
    height:8px;
    left:55px;
    top:116px;
    border-radius:10px;
    background:#8b000f;
}

/* مفتاح الصيانة */
.wrench{
    position:absolute;
    right:10px;
    top:40px;
    font-size:44px;
    transform:rotate(-25deg);
    filter:drop-shadow(0 0 10px rgba(224,0,27,.45));
    animation:wrenchMove 3s ease-in-out infinite;
}

@keyframes wrenchMove{
    0%,100%{transform:rotate(-25deg) translateY(0)}
    50%{transform:rotate(-12deg) translateY(-5px)}
}

/* عنوان */
h1{
    font-size:28px;
    margin-bottom:14px;
    line-height:1.4;
}

.description{
    color:#d9bfc2;
    font-size:14px;
    line-height:1.9;
    margin-bottom:25px;
}

/* الأزرار */
.buttons{
    display:flex;
    flex-direction:column;
    gap:12px;
}

button,
.contact{
    width:100%;
    min-height:54px;
    border-radius:15px;

    font-family:inherit;
    font-size:15px;
    font-weight:bold;

    cursor:pointer;
    text-decoration:none;

    display:flex;
    align-items:center;
    justify-content:center;

    transition:transform .2s,box-shadow .2s;
}

.retry{
    color:#fff;
    background:#23080b;
    border:1px solid #5a1018;
}

.retry:active{
    transform:scale(.97);
}

.contact{
    color:#fff;
    background:linear-gradient(135deg,#8b000f,#e0001b);
    border:1px solid #e0001b;

    box-shadow:0 10px 28px rgba(224,0,27,.22);
}

.contact:active{
    transform:scale(.97);
}

/* أسفل البطاقة */
.footer{
    margin-top:20px;
    color:#92777b;
    font-size:11px;
}

/* للموبايل */
@media(max-width:380px){
    .page{
        padding:15px;
    }

    .card{
        padding:25px 19px 22px;
    }

    .illustration{
        transform:scale(.88);
        margin-top:-5px;
        margin-bottom:10px;
    }

    h1{
        font-size:23px;
    }

    .description{
        font-size:13px;
    }

    .coming{
        top:18px;
        font-size:12px;
    }
}

/* منع تحديد وسحب العناصر */
img,
button,
a,
div{
    -webkit-user-select:none;
    user-select:none;
}
</style>
</head>

<body>

<div class="glow"></div>

<div class="particles">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
</div>

<div class="page">

    <!-- قريباً نعود -->
    <div class="coming">
        ✦ قريبًا نعود ✦
    </div>

    <main class="card">

        <!-- رسمة صيانة -->
        <div class="illustration">

            <div class="monitor"></div>
            <div class="stand"></div>
            <div class="base"></div>

            <div class="wrench">🔧</div>

        </div>

        <h1>
            توقف الموقع مؤقتًا
        </h1>

        <p class="description">
            الموقع متوقف مؤقتًا لإجراء بعض التحديثات
            والتحسينات اللازمة.
            <br>
            سنعود قريبًا بتجربة أفضل.
        </p>

        <div class="buttons">

            <button class="retry" onclick="location.reload()">
                ↻ &nbsp; إعادة المحاولة
            </button>

            <a
                class="contact"
                href="https://t.me/MidoZoneBot"
                target="_blank"
                rel="noopener noreferrer"
            >
                ✈ &nbsp; تواصل مع الإدارة
            </a>

        </div>

        <div class="footer">
            شكرًا لصبرك وتفهمك ❤️
        </div>

    </main>

</div>

</body>
</html>
