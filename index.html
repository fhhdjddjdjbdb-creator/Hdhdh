<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بحث خفي ومباشر</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#0d0f13;--panel:#111720;--panel2:#151b25;--input:#11161f;
  --border:#2d394c;--text:#f4f7fb;--muted:#9ba7ba;
  --accent:#e51d32;--accent2:#ff4053;--shadow:rgba(0,0,0,.35)
}
body.light{
  --bg:#f4f6fa;--panel:#fff;--panel2:#f0f3f8;--input:#fff;
  --border:#d6dce6;--text:#172033;--muted:#647084;
  --accent:#d71935;--accent2:#ef3b54;--shadow:rgba(20,35,60,.12)
}
body{
  margin:0;min-height:100vh;padding:14px 0 28px;
  font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);
  overflow-x:hidden;transition:.25s ease
}
*{transition:background-color .25s,color .25s,border-color .25s,box-shadow .25s}
.top{
  width:min(94%,900px);margin:auto;display:flex;justify-content:space-between;
  align-items:center;direction:ltr
}
.icon-btn{
  width:46px;height:46px;border:1px solid var(--border);border-radius:50%;
  background:var(--panel2);color:var(--text);font-size:20px;cursor:pointer
}
.dev{text-align:center;color:var(--muted);font-size:13px;margin:6px 0 14px}
.logo{text-align:center;font-size:clamp(50px,13vw,76px);font-weight:800;line-height:1;margin-bottom:8px}
.logo b:nth-child(1){color:#4285F4}.logo b:nth-child(2){color:#EA4335}
.logo b:nth-child(3){color:#FBBC05}.logo b:nth-child(4){color:#4285F4}
.logo b:nth-child(5){color:#34A853}.logo b:nth-child(6){color:#EA4335}
.sub{text-align:center;color:var(--muted);font-size:15px;margin-bottom:20px}
.wrap{width:min(92%,900px);margin:auto}
.engines{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.engine{
  flex:1 1 150px;min-height:48px;border:1px solid var(--border);
  border-radius:25px;background:var(--panel2);color:var(--text);
  font-weight:700;cursor:pointer;padding:8px
}
.engine.active{background:var(--accent);border-color:var(--accent2);color:#fff}
.search-wrap{position:relative}
.search{
  width:100%;min-height:62px;border:1px solid var(--border);border-radius:32px;
  background:var(--input);color:var(--text);font-size:17px;outline:0;
  padding:12px 52px 12px 100px;text-align:right;box-shadow:0 5px 22px var(--shadow)
}
.search::placeholder{color:var(--muted)}
.search-icon{position:absolute;right:19px;top:50%;transform:translateY(-50%);font-size:23px;color:var(--muted)}
.clear,.voice{
  position:absolute;top:50%;transform:translateY(-50%);border:0;background:transparent;
  color:var(--muted);cursor:pointer;font-size:22px
}
.clear{left:55px;display:none}.voice{left:17px}
.actions{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:9px;margin-top:12px}
.btn{
  min-height:50px;border:1px solid var(--border);border-radius:25px;
  background:var(--panel2);color:var(--text);font-weight:700;cursor:pointer;
  padding:8px 10px;overflow-wrap:anywhere
}
.btn.primary{background:var(--accent);border-color:var(--accent2);color:#fff}
.section{
  margin-top:24px;padding:17px;border:1px solid var(--border);border-radius:18px;
  background:var(--panel);box-shadow:0 5px 20px var(--shadow)
}
.section-head{display:flex;justify-content:space-between;align-items:center;font-weight:800}
.small-btn{border:0;background:transparent;color:var(--muted);cursor:pointer}
.history-item{display:flex;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--border);margin-top:8px}
.history-q{flex:1;border:0;background:transparent;color:var(--text);text-align:right;cursor:pointer}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:24px}
.quick button{min-height:86px;border:1px solid var(--border);border-radius:17px;background:var(--panel2);color:var(--text);cursor:pointer;font-weight:700}
.quick span{display:block;font-size:23px;margin-bottom:6px}
.bottom{
  width:100%;min-height:180px;margin-top:28px;border:1px solid var(--border);
  border-radius:19px;background:var(--panel);display:flex;align-items:center;
  justify-content:center;overflow:hidden;box-shadow:0 6px 24px var(--shadow)
}
.bottom img{width:100%;height:100%;max-height:360px;object-fit:contain;display:block}
.note{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:center;justify-content:center;padding:18px;z-index:5}
.modal-box{width:min(420px,100%);background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:19px;padding:20px;text-align:right}
.modal-box button{border:1px solid var(--border);border-radius:20px;background:var(--panel2);color:var(--text);padding:9px 18px;cursor:pointer}
@media(max-width:650px){
  .actions{grid-template-columns:repeat(2,minmax(0,1fr))}
  .quick{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:420px){
  .engine{flex:1 1 calc(50% - 5px);font-size:12px}
  .engine:last-child{flex-basis:100%}
  .actions{gap:7px}.btn{font-size:12px;min-height:46px}
  .quick{gap:7px}.quick button{min-height:75px;font-size:12px}
  .search{font-size:15px;padding-right:48px}
}
@media(max-width:330px){
  .actions,.quick{grid-template-columns:1fr}
  .engine,.engine:last-child{flex-basis:100%}
}

.voice-modal{
  position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.62);padding:20px
}
.voice-modal.show{display:flex}
.voice-card{
  width:min(430px,100%);min-height:310px;border-radius:28px;
  background:var(--panel);color:var(--text);border:1px solid var(--border);
  box-shadow:0 18px 50px var(--shadow);display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:28px
}
.voice-mic{
  width:82px;height:82px;border-radius:50%;border:0;background:var(--accent);
  color:#fff;font-size:34px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 12px color-mix(in srgb,var(--accent) 16%,transparent);
  animation:voicePulse 1.4s infinite
}
.voice-title{font-size:28px;font-weight:700;margin:24px 0 8px}
.voice-status{color:var(--muted);font-size:14px;min-height:22px}
.voice-bars{display:flex;align-items:center;justify-content:center;gap:5px;height:45px;margin-top:14px}
.voice-bars i{display:block;width:5px;height:12px;border-radius:5px;background:var(--accent);animation:voiceBars .8s ease-in-out infinite}
.voice-bars i:nth-child(2){animation-delay:.1s}.voice-bars i:nth-child(3){animation-delay:.2s}
.voice-bars i:nth-child(4){animation-delay:.3s}.voice-bars i:nth-child(5){animation-delay:.4s}
.voice-cancel{
  margin-top:20px;border:1px solid var(--border);border-radius:24px;
  background:var(--panel2);color:var(--text);padding:10px 22px;cursor:pointer
}
@keyframes voicePulse{50%{transform:scale(1.06);box-shadow:0 0 0 20px color-mix(in srgb,var(--accent) 4%,transparent)}}
@keyframes voiceBars{0%,100%{height:12px}50%{height:36px}}

</style>
</head>
<body>
<div class="top">
  <button class="icon-btn" id="theme" title="تغيير الوضع">☾</button>
  <button class="icon-btn" id="settings" title="الإعدادات">⚙</button>
</div>
<div class="dev">المطور: Mohamed Tamer</div>

<div class="logo"><b>G</b><b>o</b><b>o</b><b>g</b><b>l</b><b>e</b></div>
<div class="sub">إبحث الآن بشكل خفي ومباشر</div>

<main class="wrap">
  <div class="engines">
    <button class="engine active" data-engine="google">Google</button>
  </div>

  <form id="form">
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input id="input" class="search" placeholder="إبحث الآن في Google..." autocomplete="off">
      <button type="button" class="clear" id="clear">×</button>
      <button type="button" class="voice" id="voice">🎙</button>
    </div>
    <div class="actions">
      <button class="btn primary" type="submit">⌕ بحث</button>
      <button class="btn" type="button" id="open">↗ فتح الرابط</button>
      <button class="btn" type="button" id="copy">▣ نسخ البحث</button>
      <button class="btn" type="button" id="clearAll">مسح الكل</button>
    </div>
  </form>

  <section class="section">
    <div class="section-head">
      <span>◷ آخر عمليات البحث</span>
      <button class="small-btn" id="clearHistory">مسح الكل</button>
    </div>
    <div id="history"></div>
  </section>

  <div class="quick">
    <button id="quickTheme"><span>◉</span>تغيير الثيم</button>
    <button id="quickHistory"><span>▤</span>إدارة السجل</button>
    <button id="privacy"><span>♢</span>الخصوصية</button>
    <button id="quickSettings"><span>⚙</span>الإعدادات</button>
  </div>

  <!-- ضع الصورة في نفس مجلد index.html باسم bottom_image.png -->
  <div class="bottom"><img src="bottom_image.png" alt="الصورة الإضافية"></div>
  <div class="note">🔒 عمليات البحث تفتح مباشرة في محرك البحث المختار.</div>
</main>


<div class="voice-modal" id="voiceModal" aria-hidden="true">
  <div class="voice-card">
    <div class="voice-mic">🎙</div>
    <div class="voice-title">جارٍ الاستماع...</div>
    <div class="voice-status" id="voiceStatus">تحدث الآن، وسأكتب كلامك في مربع البحث</div>
    <div class="voice-bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <button class="voice-cancel" id="voiceCancel" type="button">إلغاء</button>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <h3>الإعدادات</h3>
    <p>اختر محرك البحث من الأعلى، واستخدم زر الثيم لتغيير الوضع. الاختيار محفوظ تلقائيًا على الجهاز.</p>
    <button id="close">إغلاق</button>
  </div>
</div>

<script>
const input=document.getElementById('input');
const clearBtn=document.getElementById('clear');
const historyEl=document.getElementById('history');
const engines={
 google:q=>'https://www.google.com/search?q='+encodeURIComponent(q)
};
let engine='google';

function setTheme(theme){
  document.body.classList.toggle('light',theme==='light');
  localStorage.setItem('siteTheme',theme);
  document.getElementById('theme').textContent=theme==='light'?'☀':'☾';
}
function toggleTheme(){
  setTheme(document.body.classList.contains('light')?'dark':'light');
}
function updateEngine(){
  document.querySelectorAll('.engine').forEach(b=>b.classList.add('active'));
  input.placeholder='إبحث الآن في Google...';
}
function updateClear(){clearBtn.style.display=input.value?'block':'none'}
function getHistory(){return JSON.parse(localStorage.getItem('searchHistory')||'[]')}
function saveHistory(q){
  let h=getHistory().filter(x=>x!==q);h.unshift(q);
  localStorage.setItem('searchHistory',JSON.stringify(h.slice(0,5)));renderHistory();
}
function renderHistory(){
  const h=getHistory();
  if(!h.length){historyEl.innerHTML='<div style="color:var(--muted);text-align:center;padding:14px">لا توجد عمليات بحث سابقة</div>';return}
  historyEl.innerHTML=h.map((q,i)=>`<div class="history-item">
    <button class="small-btn del" data-i="${i}">×</button>
    <button class="history-q" data-q="${encodeURIComponent(q)}">⌕ ${escapeHtml(q)}</button>
  </div>`).join('');
  document.querySelectorAll('.history-q').forEach(b=>b.onclick=()=>{
    input.value=decodeURIComponent(b.dataset.q);updateClear();input.focus();
  });
  document.querySelectorAll('.del').forEach(b=>b.onclick=()=>{
    const x=getHistory();x.splice(+b.dataset.i,1);
    localStorage.setItem('searchHistory',JSON.stringify(x));renderHistory();
  });
}
function escapeHtml(x){const d=document.createElement('div');d.textContent=x;return d.innerHTML}

document.querySelectorAll('.engine').forEach(b=>b.onclick=()=>updateEngine());
document.getElementById('form').onsubmit=e=>{
  e.preventDefault();const q=input.value.trim();if(!q)return;
  saveHistory(q);location.href=engines[engine](q);
};
clearBtn.onclick=()=>{input.value='';updateClear();input.focus()};
input.oninput=updateClear;

document.getElementById('copy').onclick=async()=>{
  const q=input.value.trim();if(!q)return;
  try{await navigator.clipboard.writeText(q)}catch{input.select();document.execCommand('copy')}
  alert('تم نسخ البحث');
};
document.getElementById('open').onclick=()=>{
  const q=input.value.trim();if(!q)return;
  window.open(/^https?:\/\//i.test(q)?q:'https://'+q,'_blank');
};
function clearEverything(){input.value='';localStorage.removeItem('searchHistory');renderHistory();updateClear();input.focus()}
document.getElementById('clearAll').onclick=clearEverything;
document.getElementById('clearHistory').onclick=()=>{
  localStorage.removeItem('searchHistory');renderHistory();
};

document.getElementById('theme').onclick=toggleTheme;
document.getElementById('quickTheme').onclick=toggleTheme;
document.getElementById('quickHistory').onclick=()=>{
  const section=document.querySelector('.section');
  section.scrollIntoView({behavior:'smooth',block:'center'});
  section.style.boxShadow='0 0 0 3px var(--accent), 0 8px 28px var(--shadow)';
  setTimeout(()=>section.style.boxShadow='',900);
};
document.getElementById('privacy').onclick=()=>alert('السجل محفوظ محليًا على هذا الجهاز فقط.');
const modal=document.getElementById('modal');
document.getElementById('settings').onclick=()=>modal.style.display='flex';
document.getElementById('quickSettings').onclick=()=>modal.style.display='flex';
document.getElementById('close').onclick=()=>modal.style.display='none';
modal.onclick=e=>{if(e.target===modal)modal.style.display='none'};

const voiceModal=document.getElementById('voiceModal');
const voiceStatus=document.getElementById('voiceStatus');
const voiceButton=document.getElementById('voice');

let recognition=null;
let voiceClosing=false;
let silenceTimer=null;
let finalTranscript='';

function clearSilenceTimer(){
  if(silenceTimer){
    clearTimeout(silenceTimer);
    silenceTimer=null;
  }
}

function closeVoiceModal(){
  voiceClosing=true;
  clearSilenceTimer();

  if(recognition){
    try{recognition.stop()}catch(e){}
  }

  voiceModal.classList.remove('show');
  voiceModal.setAttribute('aria-hidden','true');
  voiceButton.disabled=false;
  voiceButton.style.opacity='1';
}

function finishVoice(){
  clearSilenceTimer();

  // نوقف التعرف فورًا عند انتهاء كلام المستخدم.
  if(recognition){
    try{recognition.stop()}catch(e){}
  }
}

document.getElementById('voiceCancel').onclick=closeVoiceModal;

async function requestMicrophonePermission(){
  if(!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    voiceStatus.textContent='⚠️ الميكروفون يحتاج فتح الموقع عبر HTTPS أو localhost. لا تغلق النافذة؛ افتح الموقع من رابط آمن ثم اضغط الميكروفون مرة أخرى.';
    return 'unsupported';
  }

  try{
    // طلب صلاحية الميكروفون الحقيقي الذي يعرضه المتصفح/النظام.
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    // بعد الحصول على الصلاحية، SpeechRecognition يتولى التعرف على الكلام.
    stream.getTracks().forEach(track=>track.stop());
    return 'granted';
  }catch(error){
    if(error && (error.name==='NotAllowedError' || error.name==='PermissionDeniedError')){
      voiceStatus.textContent='🎙️ تم رفض صلاحية الميكروفون. اضغط سماح في إعدادات الموقع ثم جرّب مرة أخرى.';
    }else if(error && error.name==='NotFoundError'){
      voiceStatus.textContent='🎙️ لم يتم العثور على ميكروفون في الجهاز.';
    }else{
      voiceStatus.textContent='🎙️ تعذر الوصول إلى الميكروفون. اضغط مرة أخرى بعد السماح له من المتصفح.';
    }
    return 'denied';
  }
}

voiceButton.onclick=async()=>{
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;

  if(!SpeechRecognition){
    voiceStatus.textContent='التعرف الصوتي غير مدعوم في هذا المتصفح.';
    voiceModal.classList.add('show');
    voiceModal.setAttribute('aria-hidden','false');
    setTimeout(closeVoiceModal,1800);
    return;
  }

  clearSilenceTimer();
  voiceClosing=false;
  finalTranscript='';
  input.value='';
  updateClear();

  voiceModal.classList.add('show');
  voiceModal.setAttribute('aria-hidden','false');
  voiceButton.disabled=true;
  voiceButton.style.opacity='.55';
  voiceStatus.textContent='اسمح للميكروفون من نافذة المتصفح...';

  // أول ضغطة: نافذة السماح الحقيقية التي يوفرها المتصفح/النظام.
  const permissionState=await requestMicrophonePermission();

  // مهم: لا نخفي زر الميكروفون ولا نغلق واجهة الاستماع إذا رفض المتصفح
  // الصلاحية أو كانت الصفحة file://؛ المستخدم يستطيع المحاولة مرة أخرى.
  if(permissionState!=='granted'){
    voiceButton.disabled=false;
    voiceButton.style.opacity='1';
    return;
  }

  // بعد السماح يبدأ التعرف الصوتي الحقيقي.
  recognition=new SpeechRecognition();
  recognition.lang='ar-EG';
  recognition.continuous=false;
  recognition.interimResults=true;
  recognition.maxAlternatives=1;

  recognition.onstart=()=>{
    voiceStatus.textContent='🎙️ جارٍ الاستماع... تحدث الآن';
  };

  recognition.onresult=(event)=>{
    let interimTranscript='';

    for(let i=0;i<event.results.length;i++){
      const result=event.results[i];
      if(result.isFinal){
        finalTranscript += result[0].transcript + ' ';
      }else{
        interimTranscript += result[0].transcript;
      }
    }

    const liveText=(finalTranscript + interimTranscript).trim();

    if(liveText){
      input.value=liveText;
      updateClear();
      voiceStatus.textContent='🎙️ أستمع...';

      clearSilenceTimer();
      silenceTimer=setTimeout(()=>finishVoice(),1200);
    }
  };

  recognition.onerror=(event)=>{
    clearSilenceTimer();

    if(event.error==='not-allowed'||event.error==='service-not-allowed'){
      closeVoiceModal();
      return;
    }

    if(event.error==='no-speech'){
      closeVoiceModal();
      return;
    }

    if(event.error==='aborted'){
      closeVoiceModal();
      return;
    }

    closeVoiceModal();
  };

  recognition.onend=()=>{
    clearSilenceTimer();

    const query=(finalTranscript || input.value || '').trim();

    voiceClosing=true;
    voiceModal.classList.remove('show');
    voiceModal.setAttribute('aria-hidden','true');
    voiceButton.disabled=false;
    voiceButton.style.opacity='1';

    if(query){
      input.value=query;
      updateClear();
      saveHistory(query);

      // البحث تلقائيًا بعد انتهاء الكلام مثل تجربة Google.
      window.location.href=engines.google(query);
    }
  };

  try{
    recognition.start();
  }catch(e){
    closeVoiceModal();
  }
};
setTheme(localStorage.getItem('siteTheme')||'dark');
updateEngine();renderHistory();updateClear();
</script>
</body>
</html>
