name: Build MADO APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Android project
        shell: bash
        run: |
          set -e
          mkdir -p mado_build/app/src/main/java/com/mado/app
          mkdir -p mado_build/app/src/main/assets
          mkdir -p mado_build/app/src/main/res/values

          cp index.html mado_build/app/src/main/assets/index.html

          cat > mado_build/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "MADO"
          include(":app")
          EOF

          cat > mado_build/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > mado_build/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > mado_build/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }

          android {
              namespace 'com.mado.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.mado.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.activity:activity:1.10.1'
              implementation 'androidx.biometric:biometric:1.1.0'
          }
          EOF

          cat > mado_build/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">MADO</string>
          </resources>
          EOF

          cat > mado_build/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="@string/app_name"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > mado_build/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#100204</item>
                  <item name="android:navigationBarColor">#100204</item>
              </style>
          </resources>
          EOF

          cat > mado_build/app/src/main/java/com/mado/app/MainActivity.java <<'EOF'
          package com.mado.app;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.speech.RecognizerIntent;

          import androidx.activity.result.ActivityResultLauncher;
          import androidx.activity.result.contract.ActivityResultContracts;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.biometric.BiometricManager;
          import androidx.biometric.BiometricPrompt;
          import androidx.core.content.ContextCompat;

          import java.util.ArrayList;
          import java.util.Locale;
          import java.util.concurrent.Executor;

          public class MainActivity extends AppCompatActivity {
              WebView web;
              ActivityResultLauncher<String> micPermission;
              ActivityResultLauncher<Intent> speechLauncher;

              @Override public void onCreate(Bundle b) {
                  super.onCreate(b);

                  web = new WebView(this);
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);

                  web.setWebViewClient(new WebViewClient());

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(() -> {
                              boolean audio = false;
                              for (String r : request.getResources()) {
                                  if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(r)) audio = true;
                              }
                              if (audio && ContextCompat.checkSelfPermission(MainActivity.this,
                                      Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) {
                                  request.grant(new String[]{PermissionRequest.RESOURCE_AUDIO_CAPTURE});
                              } else {
                                  request.deny();
                              }
                          });
                      }
                  });

                  micPermission = registerForActivityResult(
                      new ActivityResultContracts.RequestPermission(),
                      granted -> {
                          if (granted) startNativeSpeech();
                          else jsError("لم يتم السماح بالميكروفون.");
                      });

                  speechLauncher = registerForActivityResult(
                      new ActivityResultContracts.StartActivityForResult(),
                      result -> {
                          if (result.getData() != null && result.getData().getExtras() != null) {
                              ArrayList<String> r = result.getData().getStringArrayListExtra(
                                  android.speech.RecognizerIntent.EXTRA_RESULTS);
                              if (r != null && !r.isEmpty()) {
                                  String safe = org.json.JSONObject.quote(r.get(0));
                                  web.evaluateJavascript("window.onNativeSpeechResult(" + safe + ")", null);
                              }
                          }
                      });

                  web.addJavascriptInterface(new AndroidSpeech(), "AndroidSpeech");
                  web.addJavascriptInterface(new AndroidBiometric(), "AndroidBiometric");
                  web.loadUrl("file:///android_asset/index.html");
              }

              void startNativeSpeech() {
                  Intent i = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL,
                          RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "ar-EG");
                  i.putExtra(RecognizerIntent.EXTRA_PROMPT, "تحدث الآن");
                  speechLauncher.launch(i);
              }

              void jsError(String msg) {
                  web.evaluateJavascript("window.onNativeSpeechError(" +
                      org.json.JSONObject.quote(msg) + ")", null);
              }

              public class AndroidSpeech {
                  @JavascriptInterface public void startListening(String lang) {
                      runOnUiThread(() -> {
                          if (ContextCompat.checkSelfPermission(MainActivity.this,
                                  Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                              micPermission.launch(Manifest.permission.RECORD_AUDIO);
                          } else {
                              startNativeSpeech();
                          }
                      });
                  }
              }

              public class AndroidBiometric {
                  @JavascriptInterface public void authenticate() {
                      runOnUiThread(() -> {
                          BiometricManager bm = BiometricManager.from(MainActivity.this);
                          int can = bm.canAuthenticate(
                              BiometricManager.Authenticators.BIOMETRIC_WEAK |
                              BiometricManager.Authenticators.BIOMETRIC_STRONG);
                          if (can != BiometricManager.BIOMETRIC_SUCCESS) {
                              jsError("التحقق البيومتري غير متاح على هذا الجهاز.");
                              return;
                          }

                          Executor ex = ContextCompat.getMainExecutor(MainActivity.this);
                          BiometricPrompt prompt = new BiometricPrompt(MainActivity.this, ex,
                              new BiometricPrompt.AuthenticationCallback() {
                                  @Override public void onAuthenticationSucceeded(
                                      BiometricPrompt.AuthenticationResult result) {
                                      web.evaluateJavascript("window.onNativeBiometricSuccess && window.onNativeBiometricSuccess()", null);
                                  }
                                  @Override public void onAuthenticationError(int code, CharSequence err) {
                                      web.evaluateJavascript("window.onNativeBiometricError && window.onNativeBiometricError(" +
                                          org.json.JSONObject.quote(String.valueOf(err)) + ")", null);
                                  }
                              });

                          BiometricPrompt.PromptInfo info = new BiometricPrompt.PromptInfo.Builder()
                              .setTitle("فتح MADO")
                              .setSubtitle("تحقق من هويتك للمتابعة")
                              .setNegativeButtonText("إلغاء")
                              .build();

                          prompt.authenticate(info);
                      });
                  }
              }
          }
          EOF

          # Gradle wrapper
          cd mado_build
          gradle wrapper --gradle-version 8.9
          cd ..

      - name: Build APK
        working-directory: mado_build
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MADO-debug-apk
          path: mado_build/app/build/outputs/apk/debug/app-debug.apk
